<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple JS Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="box" id="animatedBox"></div>
    </div>

    <div class="controls">
      <button id="toggleBtn">Pause Animation</button>
    </div>
    <p>💡 Tip: Click the moving box to change its color!</p>
  </body>
  <script src="script.js"></script>
</html>
